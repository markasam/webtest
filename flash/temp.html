        // Done button for each settings menu, so Enter can confirm the menu
        const settingsDoneButtons = new Map([
            [settingsModals.count, countDoneButton],
            [settingsModals.opsAndOpn, opsAndOpnDoneButton],
            [settingsModals.vals, valsDoneButton]
        ]);

        function handleKeyDown(event) {
            if (activeSettingsModal) {
                // Enter confirms a settings menu, like Done, unless it's committing a number being typed
                // in or activating a focused button (which handles Enter itself)
                const doneButton = settingsDoneButtons.get(activeSettingsModal);
                const isHandledByTarget = event.target.matches('input:not([type="checkbox"]), button');
                if (event.key === 'Enter' && doneButton && !isHandledByTarget) {
                    event.preventDefault();
                    doneButton.click();
                }
                // Escape dismisses a menu without applying changes (or the error dialog, keeping the
                // settings), unless it's cancelling a number being typed in
                if (event.key === 'Escape' && !event.target.matches('.number-input')) {
                    closeSettingsMenu();
                }
                return; // Don't start a set while a menu is open
            }
            // From the start or results screen, including the start screen with a set in progress
            if (event.key === 'Enter' && problemScreen.classList.contains('hidden')) {
                startGame();
            }
        }

        function handleDebugEnterKey(event) {
            // Ensure the event only fires for the 'Enter' key and when a game is running
            if (event.key === 'Enter' && gameState === 'running') {
                // Fully simulate a correct answer to advance state
                const timeTaken = Date.now() - problemStartTime;
                if (problemHistory[currentProblemIndex - 1]) {
                     problemHistory[currentProblemIndex - 1].time = timeTaken;
                     problemHistory[currentProblemIndex - 1].incorrect = false;
                }
                displayNewProblem();
                
                // Prevent the event from doing anything else (like submitting a form)
                event.stopPropagation();
                event.preventDefault(); 
            }
        }

        function handleDebugState() {
            const isDebugMode = window.location.hash === '#debug';

            // Toggle visibility of the postfix problem details
            postfixProblemElement.parentElement.classList.toggle('hidden', !isDebugMode);

            // Toggle visibility of the top debug status bar
            if (debugStatusElement) {
                debugStatusElement.classList.toggle('hidden', !isDebugMode);
                if (isDebugMode) {
                    updateDebugStatus();
                    window.addEventListener('resize', updateDebugStatus);
                } else {
                    window.removeEventListener('resize', updateDebugStatus);
                }
            }

            // --- NEW: Toggle the functional "Enter to skip" feature ---
            if (isDebugMode) {
                // If debug mode is ON, add the listener.
                answerInputElement.addEventListener('keyup', handleDebugEnterKey);
            } else {
                // If debug mode is OFF, remove the listener.
                answerInputElement.removeEventListener('keyup', handleDebugEnterKey);
            }
        }
        
        // Load settings from the URL and show them
        function applyUrlSettings() {
            parseUrlParams();
            if (!(config.operatorCountRange.min === 1 && config.operatorCountRange.max === 1)) {
                multiOpnCache = { ...config.operatorCountRange };
            }
            renderProblemSetDescriptions();
        }

        function init() {
            matchAnswerPlaceholderToInput();
            // A reload on a set's history entry has no set to return to
            if (history.state && history.state.flashSetId) {
                history.replaceState(null, '');
            }
            applyUrlSettings();
            initSettingsMenus();
            window.addEventListener('popstate', handleHistoryNavigation);
            
            // Set the initial state based on the URL when the page loads
            handleDebugState(); 
            
            // Listen for any future changes to the hash
            window.addEventListener('hashchange', handleDebugState);
            
            // All original event listeners remain
            answerInputElement.addEventListener('input', handleInput);
            startButton.addEventListener('click', startGame);
            newSetButton.addEventListener('click', startGame);
            restoreResultsButton.addEventListener('click', restoreResults);
            skipButtonElement.addEventListener('click', handleSkip);
            document.addEventListener('keydown', handleKeyDown);

        }

        document.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
